<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Multi-Chat - Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(139, 92, 246, 0.35),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(59, 130, 246, 0.30),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e1b4b,
                    #312e81
                );

            position: relative;
        }


        /* =========================================
           ANIMATED BACKGROUND
        ========================================= */

        body::before,
        body::after {

            content: "";

            position: absolute;

            border-radius: 50%;

            filter: blur(5px);

            animation:
                float 8s ease-in-out infinite;
        }


        body::before {

            width: 300px;

            height: 300px;

            background:
                rgba(139, 92, 246, 0.20);

            top: -100px;

            left: -80px;
        }


        body::after {

            width: 350px;

            height: 350px;

            background:
                rgba(59, 130, 246, 0.18);

            right: -120px;

            bottom: -120px;

            animation-delay: 2s;
        }


        @keyframes float {

            0%,
            100% {

                transform:
                    translate(0, 0)
                    scale(1);
            }


            50% {

                transform:
                    translate(30px, -25px)
                    scale(1.08);
            }

        }


        /* =========================================
           LOGIN CONTAINER
        ========================================= */

        .login-container {

            width: 100%;

            max-width: 430px;

            padding: 20px;

            position: relative;

            z-index: 2;
        }


        /* =========================================
           LOGIN CARD
        ========================================= */

        .login-card {

            background:
                rgba(255, 255, 255, 0.96);

            backdrop-filter:
                blur(20px);

            border-radius: 24px;

            padding: 42px 38px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.35),

                0 0 0 1px
                rgba(255, 255, 255, 0.2);

            animation:
                cardAppear 0.7s ease-out;
        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.96);
            }


            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {

            width: 76px;

            height: 76px;

            margin:
                0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            box-shadow:
                0 12px 30px
                rgba(99, 102, 241, 0.35);

            font-size: 42px;

            animation:
                logoFloat 3s ease-in-out infinite;
        }


        @keyframes logoFloat {

            0%,
            100% {

                transform:
                    translateY(0);
            }


            50% {

                transform:
                    translateY(-6px);
            }

        }


        /* =========================================
           HEADING
        ========================================= */

        .title {

            text-align: center;

            color: #1e1b4b;

            font-size: 30px;

            font-weight: 750;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 15px;

            margin-bottom: 32px;
        }


        /* =========================================
           FORM
        ========================================= */

        .form-group {

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 14px;

            font-weight: 600;
        }


        .input-wrapper {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 18px;

            pointer-events: none;
        }


        .input-wrapper input {

            width: 100%;

            height: 52px;

            padding:
                0 16px 0 46px;

            border:
                1.5px solid #e2e8f0;

            border-radius: 13px;

            outline: none;

            background: #f8fafc;

            color: #1e293b;

            font-size: 15px;

            transition:
                all 0.25s ease;
        }


        .input-wrapper input::placeholder {

            color: #94a3b8;
        }


        .input-wrapper input:focus {

            border-color:
                #6366f1;

            background:
                #ffffff;

            box-shadow:
                0 0 0 4px
                rgba(99, 102, 241, 0.10);
        }


        /* =========================================
           PASSWORD
        ========================================= */

        .password-wrapper input {

            padding-right: 50px;
        }


        .show-password {

            position: absolute;

            right: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 18px;

            color: #64748b;

            padding: 5px;
        }


        .show-password:hover {

            color: #4f46e5;
        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-button {

            width: 100%;

            height: 52px;

            margin-top: 8px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 25px
                rgba(99, 102, 241, 0.30);

            transition:
                all 0.25s ease;
        }


        .login-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 14px 30px
                rgba(99, 102, 241, 0.40);
        }


        .login-button:active {

            transform:
                translateY(0);
        }


        .login-button:disabled {

            opacity: 0.7;

            cursor:
                not-allowed;

            transform:
                none;
        }


        /* =========================================
           MESSAGE
        ========================================= */

        #message {

            min-height: 22px;

            margin-top: 15px;

            text-align: center;

            font-size: 14px;

            font-weight: 600;
        }


        /* =========================================
           REGISTER
        ========================================= */

        .register-section {

            text-align: center;

            margin-top: 25px;

            color: #64748b;

            font-size: 14px;
        }


        .register-section a {

            color: #6366f1;

            font-weight: 700;

            text-decoration: none;
        }


        .register-section a:hover {

            text-decoration:
                underline;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            text-align: center;

            margin-top: 25px;

            color: #94a3b8;

            font-size: 12px;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 500px) {

            .login-container {

                padding: 15px;
            }


            .login-card {

                padding:
                    35px 25px;

                border-radius:
                    20px;
            }


            .title {

                font-size:
                    26px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">

        <div class="login-card">


            <!-- LOGO -->

            <div class="logo">
                🤖
            </div>


            <!-- HEADING -->

            <h1 class="title">
                AI Multi-Chat
            </h1>


            <p class="subtitle">
                Your intelligent conversation space
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>


                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>


                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div
                        class="input-wrapper password-wrapper"
                    >

                        <span class="input-icon">
                            🔒
                        </span>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Login
                </button>


                <!-- MESSAGE -->

                <div id="message"></div>

            </form>


            <!-- REGISTER -->

            <div class="register-section">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <!-- FOOTER -->

            <div class="footer">

                ✨ Powered by AI Multi-Chat

            </div>


        </div>

    </div>


    <!-- =========================================
         LOGIN JAVASCRIPT
    ========================================= -->

    <script>

        const API_URL =
            "http://127.0.0.1:5000";


        // ========================================
        // LOGIN FORM
        // ========================================

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const username =
                        document
                            .getElementById("username")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const message =
                        document
                            .getElementById("message");


                    const loginButton =
                        document
                            .getElementById("loginButton");


                    // Check fields

                    if (
                        !username ||
                        !password
                    ) {

                        message.textContent =
                            "Please enter username and password.";

                        message.style.color =
                            "#dc2626";

                        return;
                    }


                    // Disable button

                    loginButton.disabled =
                        true;

                    loginButton.textContent =
                        "Logging in...";


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/login`,
                                {
                                    method:
                                        "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            username:
                                                username,

                                            password:
                                                password
                                        })
                                }
                            );


                        // Check HTTP status

                        if (!response.ok) {

                            throw new Error(
                                "Server returned " +
                                response.status
                            );
                        }


                        const data =
                            await response.json();


                        console.log(
                            "Login response:",
                            data
                        );


                        // =================================
                        // LOGIN SUCCESS
                        // =================================

                        if (
                            data.success === true
                        ) {


                            /*
                                Save the username entered
                                by the user.
                            */

                            localStorage.setItem(
                                "username",
                                username
                            );


                            message.textContent =
                                "Login successful!";

                            message.style.color =
                                "#16a34a";


                            loginButton.textContent =
                                "Opening Chat...";


                            /*
                                IMPORTANT

                                Use an absolute path based
                                on the current index.html.

                                index.html and chat.html
                                must be in the same folder.
                            */

                            window.location.href =
                                "./chat.html";


                        }

                        // =================================
                        // LOGIN FAILED
                        // =================================

                        else {

                            message.textContent =
                                data.message ||
                                "Invalid username or password.";

                            message.style.color =
                                "#dc2626";


                            loginButton.disabled =
                                false;

                            loginButton.textContent =
                                "Login";

                        }

                    }


                    // =====================================
                    // CONNECTION ERROR
                    // =====================================

                    catch (error) {

                        console.error(
                            "Login error:",
                            error
                        );


                        message.textContent =
                            "Unable to connect to the server.";

                        message.style.color =
                            "#dc2626";


                        loginButton.disabled =
                            false;

                        loginButton.textContent =
                            "Login";

                    }

                }
            );


        // ========================================
        // SHOW / HIDE PASSWORD
        // ========================================

        document
            .getElementById("showPassword")
            .addEventListener(
                "click",
                function () {

                    const password =
                        document
                            .getElementById("password");


                    if (
                        password.type ===
                        "password"
                    ) {

                        password.type =
                            "text";

                        this.textContent =
                            "🙈";

                        this.setAttribute(
                            "aria-label",
                            "Hide password"
                        );

                    }

                    else {

                        password.type =
                            "password";

                        this.textContent =
                            "👁";

                        this.setAttribute(
                            "aria-label",
                            "Show password"
                        );

                    }

                }
            );

    </script>


</body>

</html>
