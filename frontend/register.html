<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Multi-Chat - Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 10% 20%, rgba(124, 92, 255, 0.25), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(74, 144, 226, 0.20), transparent 30%),
                linear-gradient(135deg, #eef2ff, #f8f9ff);

            overflow: hidden;
            position: relative;
        }

        /* Animated background circles */
        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            animation: float 8s ease-in-out infinite;
            z-index: 0;
        }

        body::before {
            width: 280px;
            height: 280px;
            background: rgba(111, 76, 255, 0.12);
            top: -100px;
            left: -80px;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: rgba(70, 130, 230, 0.10);
            bottom: -150px;
            right: -100px;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(25px);
            }
        }

        /* Main card */
        .register-card {
            width: 420px;
            max-width: 90%;
            background: rgba(255, 255, 255, 0.92);

            padding: 42px 40px;

            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(36, 42, 80, 0.18),
                0 5px 20px rgba(0, 0, 0, 0.05);

            border: 1px solid rgba(255, 255, 255, 0.8);

            position: relative;
            z-index: 1;

            animation: cardAppear 0.7s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo */
        .logo {
            width: 72px;
            height: 72px;

            margin: 0 auto 18px;

            border-radius: 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 38px;

            background: linear-gradient(
                135deg,
                #6d4aff,
                #8b5cf6
            );

            box-shadow:
                0 10px 25px rgba(109, 74, 255, 0.3);

            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .title {
            text-align: center;
            color: #202342;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #7b7f98;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            color: #343751;
            font-size: 14px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);

            font-size: 18px;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            height: 52px;

            border: 1px solid #e0e2ed;
            border-radius: 13px;

            padding: 0 15px 0 45px;

            font-size: 15px;
            color: #252842;

            background: #fafaff;

            outline: none;

            transition: all 0.25s ease;
        }

        .input-wrapper input:focus {
            border-color: #7255f5;

            background: #ffffff;

            box-shadow:
                0 0 0 4px rgba(114, 85, 245, 0.10);
        }

        .input-wrapper input::placeholder {
            color: #a3a6b8;
        }

        /* Register button */
        .register-btn {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 13px;

            background: linear-gradient(
                135deg,
                #6748f5,
                #845ef7
            );

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 10px 22px rgba(103, 72, 245, 0.25);

            transition: all 0.25s ease;

            margin-top: 5px;
        }

        .register-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 28px rgba(103, 72, 245, 0.32);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .register-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Message */
        #message {
            min-height: 22px;
            margin-top: 15px;

            text-align: center;

            font-size: 14px;
            font-weight: 500;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        /* Login link */
        .login-link {
            text-align: center;
            margin-top: 24px;

            color: #7b7f98;
            font-size: 14px;
        }

        .login-link a {
            color: #6748f5;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 25px;

            color: #a0a3b5;
            font-size: 12px;
        }

        /* Mobile */
        @media (max-width: 500px) {

            .register-card {
                padding: 32px 25px;
            }

            .title {
                font-size: 26px;
            }

            .logo {
                width: 65px;
                height: 65px;
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <div class="register-card">

        <div class="logo">
            🤖
        </div>

        <h1 class="title">
            Create Account
        </h1>

        <p class="subtitle">
            Join AI Multi-Chat and chat with your friends + AI
        </p>

        <form id="registerForm">

            <!-- Username -->
            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>

            </div>


            <!-- Register -->
            <button
                type="submit"
                class="register-btn"
                id="registerButton"
            >
                Create Account
            </button>

        </form>


        <!-- Message -->
        <div id="message"></div>


        <!-- Login -->
        <div class="login-link">

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </div>


        <div class="footer">
            ✨ Powered by AI Multi-Chat
        </div>

    </div>


    <script>

        const API_URL = "http://127.0.0.1:5000";

        const registerForm =
            document.getElementById("registerForm");

        const usernameInput =
            document.getElementById("username");

        const passwordInput =
            document.getElementById("password");

        const registerButton =
            document.getElementById("registerButton");

        const messageBox =
            document.getElementById("message");


        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const username =
                    usernameInput.value.trim();

                const password =
                    passwordInput.value.trim();


                messageBox.textContent = "";
                messageBox.className = "";


                if (!username || !password) {

                    messageBox.textContent =
                        "Please enter username and password.";

                    messageBox.className = "error";

                    return;
                }


                if (username.length < 3) {

                    messageBox.textContent =
                        "Username must contain at least 3 characters.";

                    messageBox.className = "error";

                    return;
                }


                if (password.length < 4) {

                    messageBox.textContent =
                        "Password must contain at least 4 characters.";

                    messageBox.className = "error";

                    return;
                }


                registerButton.disabled = true;

                registerButton.textContent =
                    "Creating account...";


                try {

                    const response =
                        await fetch(
                            `${API_URL}/register`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    username: username,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (data.success) {

                        messageBox.textContent =
                            "Account created successfully! Redirecting...";

                        messageBox.className =
                            "success";


                        /*
                         * Wait a little so the user
                         * can see the success message.
                         */

                        setTimeout(
                            function() {

                                window.location.href =
                                    "index.html";

                            },
                            1200
                        );

                    } else {

                        messageBox.textContent =
                            data.message ||
                            "Username already exists.";

                        messageBox.className =
                            "error";

                        registerButton.disabled =
                            false;

                        registerButton.textContent =
                            "Create Account";
                    }

                } catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );

                    messageBox.textContent =
                        "Unable to connect to the server. Make sure Flask is running.";

                    messageBox.className =
                        "error";


                    registerButton.disabled =
                        false;

                    registerButton.textContent =
                        "Create Account";
                }

            }
        );

    </script>

</body>
</html>
